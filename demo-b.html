<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo B — ダーク＆スタイリッシュ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Zen+Kaku+Gothic+New:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Zen Kaku Gothic New', sans-serif; background: #141414; color: #e8e4de; font-size: 14px; line-height: 1.8; }
    a { text-decoration: none; color: inherit; }
    li { list-style: none; }
    img { max-width: 100%; vertical-align: bottom; }

    /* NAV */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 60px; height: 72px;
      background: rgba(20,20,20,0.95); backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px; font-weight: 300; letter-spacing: 0.35em; color: #e8e4de;
    }
    .nav-links { display: flex; gap: 36px; align-items: center; }
    .nav-links a { font-size: 10px; letter-spacing: 0.25em; color: rgba(255,255,255,0.4); }
    .nav-links a:hover { color: #C9A96E; }
    .nav-cta {
      background: #C9A96E; color: #141414 !important;
      padding: 9px 24px; font-size: 10px; letter-spacing: 0.2em;
    }
    .nav-cta:hover { background: #d4b87a !important; }

    /* HERO */
    #hero { display: flex; min-height: 100vh; padding-top: 72px; }
    .hero-text {
      width: 50%; display: flex; flex-direction: column; justify-content: center;
      padding: 80px 80px 80px 100px; background: #141414;
    }
    .eyebrow {
      font-size: 9px; letter-spacing: 0.5em; color: #C9A96E;
      display: flex; align-items: center; gap: 16px; margin-bottom: 40px;
    }
    .eyebrow::before { content:''; width: 40px; height: 1px; background: #C9A96E; }
    .hero-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(52px, 6vw, 88px); font-weight: 300;
      line-height: 1.0; letter-spacing: 0.08em; color: #e8e4de; margin-bottom: 8px;
    }
    .hero-title em { font-style: italic; color: #C9A96E; }
    .hero-sub { font-size: 10px; letter-spacing: 0.4em; color: rgba(255,255,255,0.3); margin-bottom: 52px; }
    .hero-desc { font-size: 13px; line-height: 2.4; color: rgba(255,255,255,0.45); max-width: 300px; margin-bottom: 52px; }
    .hero-btn {
      display: inline-flex; align-items: center; gap: 20px;
      background: #C9A96E; color: #141414;
      padding: 14px 36px; font-size: 10px; letter-spacing: 0.3em; width: fit-content;
      transition: all 0.3s;
    }
    .hero-btn:hover { background: #d4b87a; gap: 28px; }
    .hero-img { width: 50%; position: relative; overflow: hidden; }
    .hero-img img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.85); }
    .caption {
      position: absolute; bottom: 40px; left: 40px;
      background: rgba(20,20,20,0.75); backdrop-filter: blur(8px);
      padding: 16px 24px; border-left: 2px solid #C9A96E;
      font-size: 11px; line-height: 2; color: rgba(255,255,255,0.6);
    }

    .demo-label {
      position: fixed; bottom: 20px; left: 20px;
      background: #C9A96E; color: #141414;
      padding: 8px 16px; font-size: 11px; letter-spacing: 0.1em; border-radius: 2px;
    }
  </style>
</head>
<body>

<nav>
  <a href="#" class="logo">HAIR'S DRESSER.</a>
  <ul class="nav-links">
    <li><a href="#">EVENT</a></li>
    <li><a href="#">ABOUT</a></li>
    <li><a href="#">MENU</a></li>
    <li><a href="#">STORE</a></li>
    <li><a href="#" class="nav-cta">お問い合わせ</a></li>
  </ul>
</nav>

<section id="hero">
  <div class="hero-text">
    <p class="eyebrow">KUMAMOTO · KOSHI</p>
    <h1 class="hero-title">Hair's<br><em>Dresser.</em></h1>
    <p class="hero-sub">SINCE 2026 — HAIR SALON</p>
    <p class="hero-desc">一人ひとりのお悩みに寄り添い、丁寧なカウンセリングと施術を大切にしています。</p>
    <a href="#" class="hero-btn">MENU を見る <span>→</span></a>
  </div>
  <div class="hero-img">
    <img src="img/IMG_1366.jpg" alt="サロン外観">
    <div class="caption">
      営業時間 10:00 – 17:30<br>
      定休日 詳細は店舗情報に記載<br>
      Tel: 096-201-3775
    </div>
  </div>
</section>

<div class="demo-label">B — ダーク＆スタイリッシュ</div>

</body>
</html>
